<!DOCTYPE html>
<html>
<body>
  <p>Width: <span id="w">0</span></p>
  <p>Height: <span id="h">0</span></p>

<script>
  function throttle(fn, delay) {
    let last = 0;
    return function () {
      const now = Date.now();
      if (now - last >= delay) {
        last = now;
        fn();
      }
    };
  }

  function showSize() {
    document.getElementById("w").textContent = window.innerWidth;
    document.getElementById("h").textContent = window.innerHeight;
  }

  window.addEventListener("resize", throttle(showSize, 250));
  showSize();   // initial value
</script>
</body>
</html>
