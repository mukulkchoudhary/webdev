<!DOCTYPE html>
<html>
<head>
<style>
  .field {
    position: relative;
    margin: 40px 20px;
    width: 250px;
  }

  .field input {
    width: 100%;
    padding: 12px 10px;
    border: 2px solid #999;
    border-radius: 5px;
    font-size: 16px;
    outline: none;
  }

  .field label {
    position: absolute;
    left: 12px;
    top: 12px;
    color: #777;
    background: white;
    padding: 0 4px;
    pointer-events: none;
    transition: 0.2s ease;
  }

  /* Float up when focused OR when input has text */
  .field input:focus + label,
  .field input:not(:placeholder-shown) + label {
    top: -10px;
    font-size: 12px;
    color: #4a90d9;
  }
</style>
</head>
<body>

  <div class="field">
    <input type="text" placeholder=" ">
    <label>Your Name</label>
  </div>

</body>
</html>
