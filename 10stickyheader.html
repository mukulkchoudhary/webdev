<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 0; font-family: sans-serif; }

  header {
    position: sticky;
    top: 0;
    background: #333;
    color: white;
    padding: 25px 20px;
    font-size: 28px;
    display: flex;
    justify-content: space-between;
    align-items: center;

    /* shrink on scroll */
    animation: shrink linear both;
    animation-timeline: scroll();
    animation-range: 0 200px;
  }

  @keyframes shrink {
    to {
      padding: 8px 20px;
      font-size: 18px;
      background: #111;
    }
  }

  .content { padding: 20px; height: 2000px; }
</style>
</head>
<body>

  <header>
    <span>Logo</span>
    <span>Menu</span>
  </header>

  <div class="content">
    <p>Scroll down to see the header shrink...</p>
  </div>

</body>
</html>
