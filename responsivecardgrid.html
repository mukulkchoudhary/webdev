<!DOCTYPE html>
<html>
<head>
<style>
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 15px;
    padding: 20px;
  }

  .card {
    border: 1px solid #ccc;
    border-radius: 8px;
    overflow: hidden;
  }

  .card .img-box {
    aspect-ratio: 4 / 3;    /* strict 4:3 */
    width: 100%;
    overflow: hidden;
  }

  .card img {
    width: 100%;
    height: 100%;
    object-fit: cover;      /* crop to fill */
    display: block;
  }

  .card p {
    padding: 10px;
    margin: 0;
  }
</style>
</head>
<body>

  <div class="grid">
    <div class="card">
      <div class="img-box"><img src="https://picsum.photos/400/300" alt=""></div>
      <p>Product 1</p>
    </div>
    <div class="card">
      <div class="img-box"><img src="https://picsum.photos/400/300" alt=""></div>
      <p>Product 2</p>
    </div>
    <div class="card">
      <div class="img-box"><img src="https://picsum.photos/400/300" alt=""></div>
      <p>Product 3</p>
    </div>
    <div class="card">
      <div class="img-box"><img src="https://picsum.photos/400/300" alt=""></div>
      <p>Product 4</p>
    </div>
  </div>

</body>
</html>
