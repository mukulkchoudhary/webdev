<!DOCTYPE html>
<html>
<body>
  <div id="output">Loading...</div>
  <button id="retry" style="display:none">Retry</button>

<script>
  async function loadData() {
    const out = document.getElementById("output");
    const btn = document.getElementById("retry");
    out.textContent = "Loading...";
    btn.style.display = "none";

    try {
      const res = await fetch("https://jsonplaceholder.typicode.com/users/1");
      if (!res.ok) throw new Error("Request failed");
      const data = await res.json();
      out.textContent = "Name: " + data.name + " | Email: " + data.email;
    } catch (err) {
      out.textContent = "Error loading data!";
      btn.style.display = "inline";
    }
  }

  document.getElementById("retry").addEventListener("click", loadData);

  loadData();   // call on page load
</script>
</body>
</html>
