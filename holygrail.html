<!DOCTYPE html>
<html>
<head>
<style>
  .layout {
    display: grid;
    grid-template-columns: 200px 1fr 200px;
    grid-template-areas:
      "header header header"
      "left   main   right"
      "footer footer footer";
    gap: 10px;
  }

  header { grid-area: header; background: #4a90d9; padding: 20px; }
  .left  { grid-area: left;   background: #f0c040; padding: 20px; }
  main   { grid-area: main;   background: #e0e0e0; padding: 20px; }
  .right { grid-area: right;  background: #f0c040; padding: 20px; }
  footer { grid-area: footer; background: #4a90d9; padding: 20px; }

  @media (max-width: 768px) {
    .layout {
      grid-template-columns: 1fr;
      grid-template-areas:
        "header"
        "left"
        "main"
        "right"
        "footer";
    }
  }
</style>
</head>
<body>
  <div class="layout">
    <header>Header</header>
    <aside class="left">Left</aside>
    <main>Main</main>
    <aside class="right">Right</aside>
    <footer>Footer</footer>
  </div>
</body>
</html>
