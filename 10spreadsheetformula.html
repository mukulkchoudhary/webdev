<!DOCTYPE html>
<html>
<head>
<style>
  table { border-collapse: collapse; }
  td, th { border: 1px solid #999; padding: 5px; }
  input { width: 80px; padding: 4px; }
</style>
</head>
<body>

  <table>
    <tr>
      <th></th>
      <th>A</th>
      <th>B</th>
    </tr>
    <tr>
      <th>1</th>
      <td><input id="A1" data-cell="A1"></td>
      <td><input id="B1" data-cell="B1"></td>
    </tr>
    <tr>
      <th>2</th>
      <td><input id="A2" data-cell="A2"></td>
      <td><input id="B2" data-cell="B2"></td>
    </tr>
  </table>

<script>
  const inputs = document.querySelectorAll("input[data-cell]");

  function getValue(cell) {
    const el = document.getElementById(cell);
    const v = el.value.trim();
    if (v.startsWith("=")) {
      // formula → evaluate it too
      return evaluate(v.slice(1));
    }
    return Number(v) || 0;
  }

  function evaluate(expr) {
    // replace cell refs (A1, A2, B1, B2) with their values
    const resolved = expr.replace(/[A-B][1-2]/g, (ref) => getValue(ref));
    try {
      // safe-ish eval via Function
      return Function("return (" + resolved + ")")();
    } catch {
      return 0;
    }
  }

  inputs.forEach(inp => {
    inp.addEventListener("input", () => {
      const v = inp.value.trim();
      if (v.startsWith("=")) {
        const result = evaluate(v.slice(1));
        // show result below input? ya input ke title me?
        // Humne value wapas input me nahi daali kyunki phir formula ud jaye.
        // Simple: alert ya console me result dikhao
        console.log(inp.id + " = " + result);
        inp.title = "Result: " + result;
      }
    });
  });
</script>
</body>
</html>
