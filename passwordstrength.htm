<!DOCTYPE html>
<html>
<body>
  <input type="password" id="pass" placeholder="Enter password">
  <div id="bar" style="width:200px;height:10px;background:#ddd;margin-top:8px;">
    <div id="fill" style="height:100%;width:0;background:red;transition:0.3s;"></div>
  </div>
  <p id="msg"></p>

<script>
  const pass = document.getElementById("pass");
  const fill = document.getElementById("fill");
  const msg = document.getElementById("msg");

  pass.addEventListener("input", () => {
    const v = pass.value;
    let score = 0;

    if (v.length >= 8) score++;                 // length
    if (/[A-Z]/.test(v)) score++;               // uppercase
    if (/[a-z]/.test(v)) score++;               // lowercase
    if (/[0-9]/.test(v)) score++;               // number
    if (/[^A-Za-z0-9]/.test(v)) score++;        // special symbol

    // score 0-5
    const percent = (score / 5) * 100;
    fill.style.width = percent + "%";

    if (score <= 2)      { fill.style.background = "red";    msg.textContent = "Weak"; }
    else if (score <= 4) { fill.style.background = "orange"; msg.textContent = "Medium"; }
    else                 { fill.style.background = "green";  msg.textContent = "Strong"; }
  });
</script>
</body>
</html>
