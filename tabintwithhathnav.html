<!DOCTYPE html>
<html>
<head>
<style>
  .tab { display: inline-block; padding: 10px 20px; cursor: pointer; background: #ddd; margin-right: 5px; }
  .tab.active { background: #4a90d9; color: white; }
  .panel { display: none; padding: 20px; border: 1px solid #ccc; }
  .panel.active { display: block; }
</style>
</head>
<body>

  <div class="tabs">
    <div class="tab" data-target="tab1">Tab 1</div>
    <div class="tab" data-target="tab2">Tab 2</div>
    <div class="tab" data-target="tab3">Tab 3</div>
  </div>

  <div id="tab1" class="panel">Content of Tab 1</div>
  <div id="tab2" class="panel">Content of Tab 2</div>
  <div id="tab3" class="panel">Content of Tab 3</div>

<script>
  const tabs = document.querySelectorAll(".tab");
  const panels = document.querySelectorAll(".panel");

  function showTab(id) {
    // remove active from all
    tabs.forEach(t => t.classList.remove("active"));
    panels.forEach(p => p.classList.remove("active"));

    // activate matching ones
    const panel = document.getElementById(id);
    if (!panel) return;
    panel.classList.add("active");

    const tab = document.querySelector(`.tab[data-target="${id}"]`);
    if (tab) tab.classList.add("active");
  }

  // Click on tab → update hash
  tabs.forEach(tab => {
    tab.addEventListener("click", () => {
      location.hash = tab.dataset.target;
    });
  });

  // Hash change → show correct tab
  window.addEventListener("hashchange", () => {
    showTab(location.hash.slice(1));
  });

  // On page load → read hash
  window.addEventListener("load", () => {
    showTab(location.hash.slice(1) || "tab1");
  });
</script>
</body>
</html>
