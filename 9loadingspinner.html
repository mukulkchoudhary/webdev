<!DOCTYPE html>
<html>
<head>
<style>
  /* ===== Spinner ===== */
  .spinner {
    width: 50px;
    height: 50px;
    border: 5px solid #ddd;
    border-top-color: #4a90d9;
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* ===== Skeleton ===== */
  .skeleton {
    width: 250px;
    margin-top: 30px;
    padding: 15px;
    border: 1px solid #ddd;
    border-radius: 8px;
  }

  .sk-line {
    height: 15px;
    background: #eee;
    border-radius: 4px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }

  .sk-line.big { height: 120px; }

  /* shimmer effect */
  .sk-line::after {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 100%; height: 100%;
    background: linear-gradient(90deg, transparent, #f5f5f5, transparent);
    animation: shimmer 1.2s infinite;
  }

  @keyframes shimmer {
    to { left: 100%; }
  }
</style>
</head>
<body>

  <div class="spinner"></div>

  <div class="skeleton">
    <div class="sk-line big"></div>
    <div class="sk-line"></div>
    <div class="sk-line" style="width: 60%"></div>
  </div>

</body>
</html>
