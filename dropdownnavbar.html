<!DOCTYPE html>
<html>
<head>
<style>
  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    background: #333;
  }

  nav li {
    position: relative;   /* so submenu can sit under it */
  }

  nav a {
    display: block;
    padding: 12px 20px;
    color: white;
    text-decoration: none;
  }

  nav a:hover { background: #555; }

  /* Submenu hidden by default */
  .submenu {
    position: absolute;
    top: 100%;
    left: 0;
    min-width: 160px;
    background: #444;
    list-style: none;
    padding: 0;
    margin: 0;

    /* hidden state */
    opacity: 0;
    transform: translateY(-10px);
    pointer-events: none;
    transition: 0.25s ease;
  }

  /* Show on hover OR keyboard focus inside li */
  nav li:hover .submenu,
  nav li:focus-within .submenu {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }
</style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="#">Home</a></li>
      <li>
        <a href="#">Services</a>
        <ul class="submenu">
          <li><a href="#">Web Design</a></li>
          <li><a href="#">SEO</a></li>
          <li><a href="#">Hosting</a></li>
        </ul>
      </li>
      <li><a href="#">Contact</a></li>
    </ul>
  </nav>

</body>
</html>
